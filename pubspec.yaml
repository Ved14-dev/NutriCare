name: NutriCare
description: MVP for NutriCare - Offline-first nutrition companion
version: 1.0.0

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.0.15
  encrypt: ^5.0.1
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  firebase_auth: ^6.1.0
  flutter_gemini: ^3.0.0
  provider: any
  intl: any
  google_sign_in: ^6.1.0
  fluttertoast: ^8.2.1
  qr_flutter: ^4.1.0
  tflite_flutter: ^0.11.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  font_awesome_flutter: ^10.12.0
  flutter_local_notifications: ^19.5.0
  google_generative_ai: ^0.4.7
  image_picker: ^0.8.7+4
  firebase_storage: ^13.0.2
  http: any
  workmanager: ^0.9.0+3
  get_it: ^9.1.1
  google_fonts: ^6.3.3
  image: ^4.1.3
  lottie: ^2.7.0
  device_info_plus: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/water_wave.json
    - assets/fonts/
    - assets/food101_labels.txt
    - assets/food101.tflite
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "D:/WhatsApp Image 2025-12-05 at 10.45.47 PM.png"

