org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Workaround: disable Kotlin incremental compile in multi-drive Windows environments
# (prevents "this and base files have different roots" incremental cache errors)
kotlin.incremental=false
# Disable Kotlin daemon to avoid cross-process incremental locking problems
kotlin.daemon.enabled=false

# Disable Gradle build cache for now to avoid persisting stale caches across drives
org.gradle.caching=false
